<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | truncate: 160 }}">
  <meta name="keywords" content="{{ page.tags | join: ', ' }}">
  <meta name="author" content="Victor Davidenko">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: page.excerpt | strip_html | truncate: 160 }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="article">
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  {% include nav.html %}
  <main id="main-content">
    <article class="post">
      <div class="post-header section-dark">
        <div class="container">
          <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
          <h1>{{ page.title }}</h1>
          {% if page.description %}<p class="post-subtitle">{{ page.description }}</p>{% endif %}
        </div>
      </div>
      <div class="post-body section-light">
        <div class="container container-narrow">
          {{ content }}
        </div>
      </div>
    </article>
  </main>
  {% include footer.html %}
  <script src="/assets/js/main.js"></script>
</body>
</html>
